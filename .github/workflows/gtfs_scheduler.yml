name: GTFS Data Collector (S3 MLOps Edition)

on:
  schedule:
    # Runs 5 times per day to target specific morning, day, evening, and night patterns
    - cron: "0 4 * * *"   # 6 AM Cairo (Morning Rush)
    - cron: "0 8 * * *"   # 10 AM Cairo (Mid-day traffic)
    - cron: "0 12 * * *"  # 2 PM Cairo (Afternoon Rush)
    - cron: "0 16 * * *"  # 6 PM Cairo (Evening traffic)
    - cron: "0 20 * * *"  # 10 PM Cairo (Night patterns)
  workflow_dispatch:      # Allows manual testing runs

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Since you use a requirements.txt file, we install dependencies from it
      # Just make sure to add 'boto3' inside your requirements.txt file!
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GTFS collector & Stream to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MTA_S3_BUCKET_NAME: ${{ secrets.MTA_S3_BUCKET_NAME }}
        run: python fetch_realtime_gtfs.py
